  <meta name="description" content="Review your shopping bag and checkout securely with UPI QR Code at AbracaDabra Fashion.">
  <link rel="canonical" href="https://www.example.com/cart.html">

  <meta property="og:description" content="Review your shopping bag and checkout securely with UPI QR Code at AbracaDabra Fashion.">

</head>
<body data-p="cart">
  <main class="wrap sec" id="cart-main">
    <h1 style="font-size:36px;margin-bottom:12px">Shopping Bag &amp; Checkout</h1>
    <p style="color:#666;font-size:14px;margin-bottom:28px">Review your selected items and order summary on one side, and enter delivery details on the other side.</p>
    
    <div class="two checkout-two-col">
      <!-- SIDE 1: PRODUCTS IN BAG & ORDER SUMMARY -->
      <div id="checkout-bag-col" class="checkout-col">
        <div class="checkout-card">
          <div class="checkout-header-row">
            <h3 style="font-size:20px">1. Items in Your Bag</h3>
            <a href="shop.html" style="font-size:12.5px;color:var(--g);font-weight:600">+ Add More Items</a>
          </div>
          <div id="items"></div>
        </div>
        
        <div class="checkout-card order-summary-card" style="margin-top:24px">
          <h3 style="font-size:20px;margin-bottom:14px;border-bottom:1px solid #ebe5d8;padding-bottom:8px">2. Order Summary</h3>
          <div id="sum"></div>
        </div>
      </div>
      
      <!-- SIDE 2: DELIVERY DETAILS & PAYMENT -->
      <div id="delivery-section" class="checkout-col">
        <div class="checkout-card delivery-card">
          <h3 style="font-size:20px;margin-bottom:14px;border-bottom:1px solid #ebe5d8;padding-bottom:8px">3. Delivery Details</h3>
          <form id="co" class="form">
            <input class="f" name="name" id="cust-name" placeholder="Full Name *" required autocomplete="name">
            <input name="mobile" id="cust-mobile" placeholder="10-digit Mobile Number *" required inputmode="numeric" maxlength="10" autocomplete="tel">
            <input type="email" name="email" id="cust-email" placeholder="Email Address *" required autocomplete="email">
            <textarea class="f" name="address" id="cust-address" placeholder="Complete Street Address / Flat / Building / Area *" rows="3" required autocomplete="street-address"></textarea>
            <input name="city" id="cust-city" placeholder="City *" required autocomplete="address-level2">
            <input name="state" id="cust-state" placeholder="State *" required autocomplete="address-level1">
            <input name="pin" id="cust-pin" placeholder="6-digit PIN Code *" required inputmode="numeric" maxlength="6" autocomplete="postal-code">
            <div id="pin-delivery-pill" style="display:none;font-size:12px;margin:2px 0 10px"></div>
            <input name="landmark" id="cust-landmark" placeholder="Landmark (e.g. Near City Center Mall)">
            
            <div class="f" style="margin-top:16px">
              <h3 style="font-size:19px;margin-bottom:10px;border-bottom:1px solid #ebe5d8;padding-bottom:6px">4. Select Payment Method</h3>
              <div id="pay"></div>
            </div>

            <button type="submit" id="place-order-btn" class="btn gold f place-order-btn">
              <span>PLACE ORDER</span>
            </button>
          </form>
        </div>
      </div>
    </div>
  </main>
  <script src="js/html2pdf.bundle.min.js"></script>
  <script src="js/products.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
